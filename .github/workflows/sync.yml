name: Sync upstream
on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 h, en UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main and tags
        run: |
          git remote add upstream https://gitlab.freedesktop.org/monado/monado.git
          git fetch upstream --tags
          git push origin upstream/main:refs/heads/main
          git push origin --tags
